# =============================================================================
# Dependabot — keeps CI pinned digests from going stale.
#
# ci.yml pins every action to a commit SHA, which is immutable but never
# updates itself. These schedules open PRs that bump the SHA and the trailing
# version comment together.
# =============================================================================
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
    commit-message:
      prefix: build
