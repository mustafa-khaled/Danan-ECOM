services:
  postgres:
    image: postgres:16-alpine
    container_name: dadan-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: dadan
      POSTGRES_PASSWORD: dadan
      POSTGRES_DB: dadan
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dadan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
