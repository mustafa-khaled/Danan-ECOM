# =============================================================================
# DADAN Dijital — Production Docker Compose
#
# Target: docker compose (v2) on a single Ubuntu VPS — NOT Docker Swarm.
#
# Key design decisions:
#   - Explicit dadan bridge network replaces the implicit default
#   - deploy: blocks removed (they are Swarm-only and silently ignored by
#     docker compose); replaced with service-level mem_limit / cpus /
#     mem_reservation which apply with docker compose up.
#   - init: true on every service — Docker wraps the process with tini for
#     reliable PID 1 signal handling and zombie reaping.
#   - security_opt no-new-privileges prevents privilege escalation
#     inside containers.
#   - cap_drop: ALL on every service, with only the minimum cap_add needed
#     by each entrypoint (postgres/nginx init, nobody else).
#   - read_only: true on every service — application code cannot be modified
#     at runtime. Writable paths (/tmp, sockets, caches) are provided via
#     tmpfs mounts or bind mounts where persistence is needed.
#   - tmpfs mounts for runtime-writable directories that do not need to
#     survive restarts (/tmp, PID directories, nginx cache).
#   - stop_grace_period tuned per service (Postgres needs longest — WAL
#     flush; nginx can stop almost instantly).
#   - Logging rotation (10 MB per file, 3 rotated files) prevents disk
#     exhaustion from container stdout.
#   - healthcheck start_period gives each service time to initialise before
#     the first check runs, avoiding false alarms during boot.
#   - env_file only on api — the only service that consumes app-level
#     environment variables. Postgres/Redis/web/nginx get only the specific
#     variables they need (explicit environment: blocks), keeping the
#     attack surface minimal.
# =============================================================================

services:
  # -----------------------------------------------------------------------
  # postgres — primary database
  # -----------------------------------------------------------------------
  # Internal only: no ports exposed to the host. Accessible only by other
  # services on the dadan network.
  #
  # Capabilities: the entrypoint (gosu + chown) requires CHOWN, DAC_OVERRIDE,
  # FOWNER, SETGID, and SETUID to set up the data directory and drop
  # privileges to the postgres user.
  #
  # read_only: data directory is a bind mount; Unix socket and temp files
  # use tmpfs.
  # -----------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    stop_grace_period: 60s
    mem_limit: 1g
    mem_reservation: 256m
    cpus: "1.0"
    environment:
      POSTGRES_USER: dadan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: dadan
    volumes:
      - /opt/dadan/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dadan -d dadan"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dadan

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - /opt/dadan/data/redis:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dadan

  # -----------------------------------------------------------------------
  # api — NestJS REST API
  # -----------------------------------------------------------------------
  # Exposed only internally (expose: 4000); reachable by nginx and web via
  # the dadan network. Loads .env as env_file for convenience while keeping
  # critical variables declared explicitly for startup validation (:?).
  #
  # Capabilities: runs as the nestjs user. No special capabilities needed
  # (port 4000 is unprivileged, no filesystem writes required).
  #
  # read_only: application code cannot be modified at runtime. /tmp is a
  # tmpfs for Node.js / Prisma temp files.
  # -----------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - /opt/dadan/data/uploads:/app/uploads
    stop_grace_period: 30s
    mem_limit: 512m
    mem_reservation: 128m
    cpus: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://dadan:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/dadan
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CERT_SIGNING_SECRET: ${CERT_SIGNING_SECRET:?CERT_SIGNING_SECRET is required}
      HOUSE_KEY_SALT: ${HOUSE_KEY_SALT:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/app/uploads}
      BASE_URL: ${BASE_URL:?BASE_URL is required}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      PDF_WATERMARK_TEXT: ${PDF_WATERMARK_TEXT:-DADAN DIJITAL — AUTHENTICATED}
      PAYMENT_PROVIDER_KEY: ${PAYMENT_PROVIDER_KEY:-}
      PAYMENT_PROVIDER_SECRET: ${PAYMENT_PROVIDER_SECRET:-}
      VAT_RATE: ${VAT_RATE:-0.15}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    expose:
      - "4000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dadan

  # -----------------------------------------------------------------------
  # web — Next.js (client app + admin dashboard)
  # -----------------------------------------------------------------------
  # Exposed internally (expose: 3000). NEXT_PUBLIC_* values are baked at
  # build time via build args; the runtime environment only needs NODE_ENV
  # and API_URL for server-side API calls.
  #
  # Capabilities: runs as the nextjs user. No special capabilities needed
  # (port 3000 is unprivileged).
  #
  # read_only: Next.js standalone output is immutable at runtime. /tmp is
  # a tmpfs for Node.js temp files.
  # -----------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_PAYMENT_MODE: ${NEXT_PUBLIC_PAYMENT_MODE:-mock}
        NEXT_PUBLIC_VAT_RATE: ${VAT_RATE:-0.15}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    mem_limit: 512m
    mem_reservation: 128m
    cpus: "1.0"
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dadan

  # -----------------------------------------------------------------------
  # nginx — reverse proxy / TLS termination / rate limiting
  # -----------------------------------------------------------------------
  # The ONLY service with host-facing ports. Everything else routes through
  # nginx. Configuration is bind-mounted from the repo (read-only).
  #
  # Capabilities: the master process (root) needs NET_BIND_SERVICE to bind
  # to port 80, plus SETGID/SETUID to drop privileges for worker processes.
  # CHOWN and DAC_OVERRIDE are needed for temp directory creation.
  #
  # read_only: nginx binary and config are immutable. Temp files, cache,
  # and PID file use tmpfs.
  # -----------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
      - /var/lib/letsencrypt
    stop_grace_period: 10s
    mem_limit: 128m
    mem_reservation: 32m
    cpus: "0.5"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/healthz || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dadan

# ---------------------------------------------------------------------------
# Explicit bridge network
# ---------------------------------------------------------------------------
# All services attach to this single network. Only nginx publishes host
# ports; postgres and redis are reachable only by name resolution within
# this network, keeping them internal.
# ---------------------------------------------------------------------------
networks:
  dadan:
    driver: bridge
