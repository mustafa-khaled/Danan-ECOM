# =============================================================================
# Grafana — auto-provisioned datasources
#
# These datasources are created automatically when Grafana starts. The user
# can add more through the Grafana UI after login.
# =============================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 5000
