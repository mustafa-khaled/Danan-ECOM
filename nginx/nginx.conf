# =============================================================================
# DADAN Dijital — Production nginx Configuration
#
# Serves as the sole public entry point. All external traffic arrives here
# and is proxied to either the Next.js web app or the NestJS API.
#
# Key design decisions:
#   - HTTP/2 cleartext (h2c) enabled; browsers will use HTTP/1.1 until TLS
#     is added (see docs/DEPLOYMENT.md §6 for TLS setup).
#   - gzip compression reduces bandwidth for text-based responses.
#   - client_max_body_size (20 MB) matches the storage service upload limit.
#   - proxy buffering isolates slow clients from upstream services.
#   - secutiry headers (HSTS, X-Frame-Options, Permissions-Policy, etc.)
#     are set at the server block and inherited by all locations.
#   - Real-IP configuration trusts Docker bridge / overlay subnets;
#     uncomment Cloudflare IPs if deployed behind Cloudflare proxy.
#   - WebSocket Upgrade / Connection headers are forwarded for future
#     real-time features; harmless for normal HTTP requests.
#   - Static assets use long-lived cache headers (1 year for content-hashed
#     Next.js files, 7 days for other static extensions).
#   - No routing changes: /api/* → api:4000, /*       → web:3000.
# =============================================================================

worker_processes auto;

events {
  worker_connections  1024;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ---------------------------------------------------------------------------
  # Basic optimisations
  # ---------------------------------------------------------------------------
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  keepalive_requests 100;
  server_tokens off;

  # ---------------------------------------------------------------------------
  # JSON access log — structured output ingestible by Loki / any log shipper
  # ---------------------------------------------------------------------------
  # Logs to stdout (captured by Docker's logging driver). Each line is a JSON
  # object with request metadata, upstream info, and timing.
  # ---------------------------------------------------------------------------
  log_format json escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"x_request_id":"$upstream_http_x_request_id",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_response_time":"$upstream_response_time"'
  '}';

  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  # ---------------------------------------------------------------------------
  # Gzip compression
  # ---------------------------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;

  # ---------------------------------------------------------------------------
  # Client request body size
  # ---------------------------------------------------------------------------
  # Matches the 20 MB limit enforced by the storage service. Requests
  # exceeding this receive a 413 (Request Entity Too Large).
  client_max_body_size 20m;

  # ---------------------------------------------------------------------------
  # Proxy buffering and timeouts
  # ---------------------------------------------------------------------------
  proxy_buffering on;
  proxy_buffer_size 4k;
  proxy_buffers 8 16k;
  proxy_busy_buffers_size 32k;
  proxy_connect_timeout 30s;
  proxy_send_timeout    30s;
  proxy_read_timeout    30s;

  # ---------------------------------------------------------------------------
  # Real-IP — resolve true client IP when behind a proxy
  # ---------------------------------------------------------------------------
  # Docker bridge / overlay networks (always present in a Compose setup):
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  # If behind Cloudflare proxy (recommended, see DEPLOYMENT.md §6A),
  # uncomment the following lines:
  # include /etc/nginx/cloudflare-ips.conf;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # ---------------------------------------------------------------------------
  # Rate limiting zones (shared memory)
  # ---------------------------------------------------------------------------
  # api_limit:    stricter — auth, certificate generation, payment
  # general_limit: relaxed — page loads, static assets
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;

  # ---------------------------------------------------------------------------
  # Maps
  # ---------------------------------------------------------------------------
  map $http_x_forwarded_proto $redirect_to_https {
    default 0;
    http 1;
  }

  map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  # ---------------------------------------------------------------------------
  # Upstreams
  # ---------------------------------------------------------------------------
  upstream web_app {
    server web:3000;
  }

  upstream api_app {
    server api:4000;
  }

  # ===========================================================================
  # Server
  # ===========================================================================
  server {
    listen 80 http2;
    server_name _;

    # ---- HTTP → HTTPS redirect (when behind a TLS-terminating proxy) ----
    if ($redirect_to_https) {
      return 301 https://$host$request_uri;
    }

    # ======================================================================
    # Security headers
    #
    # Set at the server level and inherited by all `location` blocks that
    # do NOT use `add_header` themselves. All cache-control below is set
    # via the `expires` directive, which does not interfere with inheritance.
    # ======================================================================

    # HSTS — always use HTTPS for this domain (preload flag for submission)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;
    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Control referrer information sent with cross-origin requests
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Restrict browser features (keep default=deny for unused APIs)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # Content-Security-Policy — extend after review.
    # 'unsafe-inline' and 'unsafe-eval' are required by Next.js for inline
    # scripts/styles and Webpack eval source maps. Evaluate removing
    # 'unsafe-eval' once the app no longer depends on eval-based maps.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;

    # ======================================================================
    # API — /api/*  →  NestJS :4000
    # ======================================================================
    # Routing: the `/api` prefix is stripped (trailing slash on proxy_pass).
    # Rate-limited independently so auth-heavy bursts don't starve pages.
    # ======================================================================
    location ^~ /api/ {
      limit_req zone=api_limit burst=40 nodelay;

      proxy_pass http://api_app/;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;

      # API responses are always dynamic — prevent any caching
      expires off;
    }

    # ======================================================================
    # Next.js static assets — content-hashed, immutable
    # ======================================================================
    # Next.js appends content hashes to filenames under _next/static, so
    # these can be cached permanently (1 year + immutable hint). If the
    # content changes, the URL changes too.
    # ======================================================================
    location ^~ /_next/static/ {
      proxy_pass http://web_app;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;

      expires 365d;
    }

    # ======================================================================
    # Other static file extensions — moderate cache
    # ======================================================================
    # Images, fonts, CSS, JS that are not under _next/static/. These are
    # less likely to change but not content-hashed, so a 7-day revalidate
    # window is a safe default.
    # ======================================================================
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|woff2?|eot|ttf|otf|css|js)$ {
      proxy_pass http://web_app;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;

      expires 7d;
    }

    # ======================================================================
    # Web app — /*  →  Next.js :3000
    # ======================================================================
    # Catch-all for everything else (pages, admin dashboard, SSR).
    # WebSocket headers forwarded for future real-time compatibility.
    # ======================================================================
    location / {
      limit_req zone=general_limit burst=100 nodelay;

      proxy_pass http://web_app;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;

      # WebSocket support (forwarded unconditionally; no-op for normal HTTP)
      proxy_set_header Upgrade            $http_upgrade;
      proxy_set_header Connection         "upgrade";
    }
  }
}
